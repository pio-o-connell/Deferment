log4j.rootLogger=WARN, console

# DBUnit warns on every table that the default data type factory is used with MySQL; harmless for these tests
log4j.logger.org.dbunit.dataset.AbstractTableMetaData=ERROR

log4j.logger.org.springframework.aop.framework.CglibAopProxy=WARN, cglibWarnings
log4j.additivity.org.springframework.aop.framework.CglibAopProxy=false

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{ISO8601} %-5p [%t] %c - %m%n

log4j.appender.cglibWarnings=org.apache.log4j.FileAppender
log4j.appender.cglibWarnings.File=target/cglib-proxy-warnings.log
log4j.appender.cglibWarnings.Append=true
log4j.appender.cglibWarnings.layout=org.apache.log4j.PatternLayout
log4j.appender.cglibWarnings.layout.ConversionPattern=%d{ISO8601} %-5p [%t] %c - %m%n
